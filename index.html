      @keyframes float {

      }

      @keyframes shine {
        0%,

        }
        45%,
        55% {

        }
      }
      @keyframes pulse {
        0%,

        }

      .wrap {

        padding: 12px 14px;

      /* BANNER — neon frame + corner brackets + float */
      .banner {
        position: relative;
        width: 100%;

        margin-bottom: 18px;
        border-radius: 18px;
        animation: float 5s ease-in-out infinite;

      .banner .frame::after {
        content: "";
        position: absolute;
        top: 0;
        left: -60%;
        width: 42%;
        height: 100%;
        background: linear-gradient(

          transparent,

        border-bottom: none;
        border-radius: 8px 0 0 0;
      }
      .cnr.tr {
